<h3 class="text-center">{{nombre()}}</h3>
<img [src]="srcImagen()" class="img-fluid" alt="nombre()">
<h6>Ingredientes:</h6>
<ul>
    @for (ingrediente of listaIngredientes(); track ingrediente) {
        <li>{{ ingrediente }}</li>
    }
</ul>
<p>Precio: {{precio()}} €</p>
<label for="cantidad">Cantidad:</label>
<input type="text" name="cantidad" [value]="valorInput"
    (input)="valorInput = $any($event.target).value">
<button type="button" (click)="anadirPedido()">Añadir al pedido</button>
<p class="error"> {{ mensajeError }} </p>

<div class="container-fluid formulario-pizza">
    <h3>Realizar Pedido</h3>
    <form>
        <label for="hora">Hora de envio:</label>
        <input type="time" id="hora"
               name="hora" required>
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion"
               name="direccion" required>
        <label for="pago">Metodo de pago:</label>
        <select [value]="tipoSeleccionado" (change)="cambiarTipo($event)" id="metodo" name="metodo">
            <option value="bizum">Bizum</option>
            <option value="tarjeta">Tarjeta</option>
        </select>
        <div>
          <label for="numeros">{{ textoEtiqueta }}</label>
          <input type="text" [value]="valorInput" (input)="leerInput($event)"
              id="numeros" name="numeros" required>
          <p class="error"> {{ mensajeError }} </p>
        </div>
        <br>
        <button type="submit">Enviar pedido</button>
    </form>
</div>

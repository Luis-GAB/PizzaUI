<app-navbar (eventClick)="recibirBusqueda($event)" (paginaSeleccionada)="cambiarPagina($event)"></app-navbar>

@if (paginaActual === 'listapizzas') {
    <app-listapizzas
        [ingredienteBuscar]="ingredienteBuscar"
        (pizzaSeleccionada)="recibirPizza($event)">
    </app-listapizzas>
}

@if (paginaActual === 'formulario') {
    <app-formulario
        [pizzasPedido]="pizzasPedido">
    </app-formulario>
}
